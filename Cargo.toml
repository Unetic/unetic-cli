[package]
name = "unetic-cli"
version = "0.1.1"
edition = "2024"
description = "Terminal interface for the Unetic OpenWrt control plane"
repository = "https://github.com/Unetic/unetic-cli"
license = "GPL-2.0-only"
rust-version = "1.97"

[dependencies]
anyhow = "1.0"
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal"] }
ubus = "0.1.7"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
