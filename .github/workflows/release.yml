name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic tag to publish, e.g. v0.1.0
        required: true
        type: string

concurrency:
  group: unetic-cli-release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    uses: Unetic/packages/.github/workflows/reusable-rust.yml@main
    with:
      component_name: unetic-cli
      binary_name: unetic-cli
      release: true
      ref: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
